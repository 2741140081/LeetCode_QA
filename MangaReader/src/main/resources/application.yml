spring:
  application:
    name: manga-reader
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/manga_reader?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: edms
    password: edms
    hikari:
      pool-name: HikariPool-Manga
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true

# 添加 MyBatis 的 mapper 扫描路径和配置选项。
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.mangareader.model.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    lazy-loading-enabled: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 添加漫画存储根目录、缓存目录和阅读器相关配置。
manga:
  storage:
    root: D:/MangaLibrary
    image-path: D:/images/TestManga
    cache-root: D:/MangaReader/cache
  reader:
    preload-count: 20
    save-interval: 30
    default-scale: 1.0
    scroll-step: 0.1
  image:
    supported-formats: jpg,jpeg,png,webp,gif
    max-memory-cache-size: 50
    default-error-image: /images/error_placeholder.png
  autoplay:
    default-scroll-distance: 0.5  # 每次点击滚动条箭头时滚动的单位增量
    default-scroll-interval: 16  # 默认滚动间隔(毫秒) 相当于 60fps
    scroll-distance-step: 0.1  # 加速/减速时滚动距离的调整步长(像素)
    min-scroll-distance: 0.1  # 最小滚动距离(像素)
    max-scroll-distance: 10.0  # 最大滚动距离(像素)
  download:
    base-url: https://toupaimh.com
    referer: https://tpmh3.com/
    timeout: 30000
    css-selector: "ul.list-unstyled.bookAll-item-list li a"
    user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36 Edg/138.0.0.0"
    headers:
      accept: "image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8"
      accept-encoding: "image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6"
  download-config:
    save-base-path: /data/images/
    core-threads: 8
    max-threads: 16
    batch-size: 50
    max-retry: 3
    connect-timeout: 10000
    read-timeout: 30000
    buffer-size: 8192

# 添加 Logback 日志框架的详细配置。
logging:
  level:
    root: INFO
    com.mangareader: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/manga-reader.log
    max-size: 100MB
    max-history: 30
    total-size-cap: 3GB
  logback:
    rollingpolicy:
      max-file-size: 100MB
      file-name-pattern: logs/manga-reader.%d{yyyy-MM-dd}.%i.log

