# 添加漫画存储根目录、缓存目录和阅读器相关配置。
manga:
  storage:
    root: D:/MangaLibrary
    cache-root: D:/MangaReader/cache
  reader:
    preload-count: 20
    save-interval: 30
    default-scale: 1.0
    scroll-step: 0.1
  image:
    supported-formats: jpg,jpeg,png,webp,gif
    max-memory-cache-size: 50
    default-error-image: /images/error_placeholder.png

# 添加 Logback 日志框架的详细配置。
logging:
  level:
    root: INFO
    com.mangareader: DEBUG
    com.mangareader.dao: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/manga-reader.log
    max-size: 100MB
    max-history: 30
    total-size-cap: 3GB
  logback:
    rollingpolicy:
      max-file-size: 100MB
      file-name-pattern: logs/manga-reader.%d{yyyy-MM-dd}.%i.log

