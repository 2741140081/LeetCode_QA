spring:
  application:
    name: manga-reader
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/manga_reader?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    hikari:
      pool-name: HikariPool-Manga
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true
  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms
  web:
    resources:
      static-locations: classpath:/static/,file:${manga.storage.image-path}/
      cache:
        cachecontrol:
          max-age: 7d
          cache-public: true
  mvc:
    async:
      request-timeout: 300000


server:
  port: 8080
  # 启用 gzip 压缩，减少图片以外的响应体积
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,text/xml
    min-response-size: 1024

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.mangareader.model.entity
  type-handlers-package: com.mangareader.config
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    lazy-loading-enabled: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 漫画存储与阅读器配置
manga:
  storage:
    root: D:/MangaLibrary
    image-path: D:/MangaLibrary/manga
    cache-root: D:/MangaLibrary/cache
  reader:
    preload-count: 20
    save-interval: 30
    default-scale: 1.0
    scroll-step: 0.1
  image:
    supported-formats: jpg,jpeg,png,webp,gif
    max-memory-cache-size: 50
    default-error-image: /images/error_placeholder.png
  autoplay:
    default-scroll-distance: 0.5
    default-scroll-interval: 16
    scroll-distance-step: 0.1
    min-scroll-distance: 0.1
    max-scroll-distance: 10.0
  download:
    base-url: https://tpmh3.com
    referer: https://tpmh3.com/
    timeout: 30000
    css-selector: "ul.list-unstyled.bookAll-item-list li a"
    user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36 Edg/138.0.0.0"
    headers:
      accept: "image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8"
      accept-encoding: "image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6"
  download-config:
    scan-cron: 0/30 * * * * ?
    download-timeout: 600
    core-threads: 10
    max-threads: 24
    batch-size: 100
    max-retry: 3
    connect-timeout: 10000
    read-timeout: 30000
    buffer-size: 8192

# 日志配置
logging:
  level:
    root: INFO
    com.mangareader: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/manga-reader-web.log
    max-size: 100MB
    max-history: 30
    total-size-cap: 3GB
  logback:
    rollingpolicy:
      max-file-size: 100MB
      file-name-pattern: logs/manga-reader.%d{yyyy-MM-dd}.%i.log

# PageHelper 分页插件配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# JWT 配置
jwt:
  # 签名密钥（至少 32 字符，生产环境请使用更安全的随机字符串）
  secret: MangaReader2026SecretKeyForJwtTokenSigningMustBeLongEnough
  # Token 过期时间（分钟），默认 7 天
  expiration: 10080
